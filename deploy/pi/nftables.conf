#!/usr/sbin/nft -f
# Pi стоит в общем сегменте «провайдера» (192.168.1.0/24 — DHCP и L2 друга).
# Наружу торчат только брокер (1883) и панель (8080), и только для наших адресов:
#   .1.145 — VDS (публикует сюда данные домашнего сайта)
#   .1.222 — дом через NAT домашнего роутера (браузер/HA/скрипты)
#   .1.224 — NAS, второй NIC в этом же сегменте
# SSH (22) не фильтруем, чтобы не отрезать себя при смене адреса роутера.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
        ct state established,related accept
        iif lo accept
        tcp dport { 1883, 8080 } ip saddr { 192.168.1.145, 192.168.1.222, 192.168.1.224 } accept
        tcp dport { 1883, 8080 } drop
    }
}
