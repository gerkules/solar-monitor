# Общий оверрайд для Orange Pi 3 LTS: Grafana не только на localhost.
# У Grafana свой логин (admin / GRAFANA_PASSWORD из .env), поэтому открывать её
# в локальной сети на :3001 безопасно. HTTPS-прокси Caddy (:3443) остаётся опцией.
#
#   docker compose -f docker-compose.yml -f deploy/orangepi/docker-compose.orangepi.yml up -d
services:
  grafana:
    ports:
      - "${GRAFANA_LAN_PORT:-3001}:3000"
