; Wemos D1 mini (ESP8266): монитор инвертора PI30 + мост TCP<->RS232 для solar-monitor
; База: FW 118 из /volume1/WD4/AI/esp32invertormonitornovyi/wemos_usb_firmware/wemos8266_lite.cpp
[platformio]
default_envs = d1_mini
src_dir = .

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 230400
build_src_filter = +<wemos8266_bridge.cpp>
