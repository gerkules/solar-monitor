# Один стек для любой машины: mini PC, VDS или Synology NAS.
# Инвертор опрашивает только collector; InfluxDB и Grafana — обычные контейнеры,
# поэтому один и тот же файл работает и с USB-кабелем, и на VDS с сетевым донглом.

services:
  collector:
    build: ./collector
    image: solar-monitor-collector:latest
    container_name: solar-collector
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_BIND:-0.0.0.0}:${API_HOST_PORT:-8080}:8080"
      - "${API_BIND:-0.0.0.0}:${API_HTTPS_HOST_PORT:-8443}:8443"
    volumes:
      - ./data/collector:/data
      - ./data/certs:/certs:ro        # TLS_CERT=/certs/server.crt (см. tools/gen-cert.sh)
    # --- физическое подключение (USB-HID или USB-RS232) ---------------------
    # Раскомментируйте нужное. На VDS USB нет — там TRANSPORT=tcp.
    # devices:
    #   - /dev/hidraw0:/dev/hidraw0
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # group_add:
    #   - dialout
    depends_on:
      influxdb:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      # понимает и http, и https (self-signed) — см. solar_monitor/healthcheck.py
      test: ["CMD", "python", "-m", "solar_monitor.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    container_name: solar-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUX_USER:-admin}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG:-solar}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET:-solar}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}"
      DOCKER_INFLUXDB_INIT_RETENTION: "${INFLUX_RETENTION:-30d}"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./data/influxdb-config:/etc/influxdb2
    ports:
      - "127.0.0.1:${INFLUX_PORT:-8086}:8086"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  grafana:
    image: grafana/grafana:11.3.0
    container_name: solar-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG:-solar}"
      INFLUX_BUCKET: "${INFLUX_BUCKET:-solar}"
      SITE: "${SITE:-home}"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"     # наружу — только через Caddy ниже
    depends_on:
      - influxdb
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Grafana наружу: HTTPS (self-signed) + Basic-авторизация.
  # Grafana свой пароль тоже имеет — это второй слой, не замена.
  caddy:
    image: caddy:2
    container_name: solar-caddy
    restart: unless-stopped
    environment:
      GRAFANA_PROXY_USER: "${GRAFANA_PROXY_USER:-admin}"
      GRAFANA_PROXY_HASH: "${GRAFANA_PROXY_HASH:?set GRAFANA_PROXY_HASH in .env (caddy hash-password)}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/certs:/certs:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    ports:
      - "${GRAFANA_PROXY_PORT:-3443}:443"
    depends_on:
      - grafana
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Локальный брокер — только если своего нет (профиль local-broker).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: solar-mosquitto
    profiles: ["local-broker"]
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto:/mosquitto/data
      - ./data/mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
