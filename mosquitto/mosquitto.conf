# Local broker for a standalone installation (profile: local-broker).
# For a real deployment create ./data/mosquitto/passwd and switch
# allow_anonymous to false:
#   docker run --rm -it -v $PWD/data/mosquitto:/m eclipse-mosquitto:2 \
#     mosquitto_passwd -b -c /m/passwd solar <password>
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
